name: Drive photo intake

# Install: copy this file to .github/workflows/drive-intake.yml (see integrations/drive-webhook/README.md).
# Pure code, no agent: new photos in the Drive folder go on the map as camera pins.
# Triggers: a 15-minute poll, a `drive-photos` repository_dispatch (the webhook, see
# integrations/drive-webhook/README.md) and a manual run. Needs two repository secrets:
# GOOGLE_SERVICE_ACCOUNT_JSON and VILLACANA_DRIVE_FOLDER. Until they exist the job does nothing.
on:
  schedule:
    - cron: '*/15 * * * *'
  repository_dispatch:
    types: [drive-photos]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: drive-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      VILLACANA_DRIVE_FOLDER: ${{ secrets.VILLACANA_DRIVE_FOLDER }}
    steps:
      - name: Drive access configured?
        id: gate
        run: |
          if [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ] && [ -n "$VILLACANA_DRIVE_FOLDER" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "GOOGLE_SERVICE_ACCOUNT_JSON / VILLACANA_DRIVE_FOLDER are not set: nothing to do."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.on == 'true'
        with:
          ref: main
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.on == 'true'
        with:
          python-version: '3.12'
      - name: Install
        if: steps.gate.outputs.on == 'true'
        run: python3 -m pip install Pillow==11.3.0 pillow-heif==0.22.0 google-auth==2.40.3 requests==2.32.4
      - name: Index new photos
        if: steps.gate.outputs.on == 'true'
        run: python3 scripts/drive_intake.py | tee "$RUNNER_TEMP/intake.log"
      - name: Checks
        id: checks
        if: steps.gate.outputs.on == 'true'
        run: |
          if git status --porcelain | grep -q .; then
            python3 scripts/test_photo_assignment.py
            python3 scripts/test_reference_index.py
            python3 scripts/test_placement_verification.py
            # Untagged photos with no area are expected here: report them, do not block.
            python3 scripts/build_references.py --check || echo "::warning::build_references --check reports photos that still need tags"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push to main
        if: steps.checks.outputs.changed == 'true'
        run: |
          git config user.name "villacana-drive-intake"
          git config user.email "drive-intake@users.noreply.github.com"
          git add -A public refs data
          git commit -m "Index new Drive photos (automatic intake)" -m "Camera pins only: what each photo shows is still untagged."
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Redeploy the site
        if: steps.checks.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Summary
        if: steps.checks.outputs.changed == 'true'
        run: |
          {
            echo '### New photos indexed'
            tail -n 3 "$RUNNER_TEMP/intake.log"
          } >> "$GITHUB_STEP_SUMMARY"
