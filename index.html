<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Villacana · map and photos</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; background: #c9a07a; font-family: system-ui, sans-serif; overflow: hidden; }
      #map { width: 100vw; height: 100dvh; touch-action: none; display: block; }
      .bar { position: fixed; left: 0; right: 0; display: flex; gap: 8px; align-items: center; padding: 0 12px; overflow-x: auto; scrollbar-width: none; }
      .bar::-webkit-scrollbar { display: none; }
      #bar { bottom: 12px; }
      #editbar { bottom: 62px; }
      #editbar[hidden], #legend[hidden], #viewer[hidden] { display: none; }
      .bar button, .bar a, .bar select, #legend, #picked { flex: none; background: #fffdf8; border: 1px solid #c9bfae; border-radius: 999px; padding: 8px 14px; font-size: 14px; color: #222; text-decoration: none; white-space: nowrap; }
      .bar button[aria-pressed="true"] { background: #222; color: #fff; }
      .bar button:disabled { opacity: 0.45; }
      #send { background: #1c6fd1; color: #fff; border-color: #1c6fd1; }
      #picked { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); max-width: 92vw; overflow: hidden; text-overflow: ellipsis; }
      #editbar[hidden] ~ #picked { display: none; }
      #legend { position: fixed; top: 12px; left: 12px; border-radius: 12px; line-height: 1.6; font-size: 13px; white-space: normal; }
      #legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border: 1px solid #0006; vertical-align: -1px; }
      #map-controls { position:fixed; top:12px; right:12px; display:flex; gap:5px; flex-wrap:nowrap; overflow-x:auto; max-width:calc(100vw - 24px); z-index:3; }
      #map-controls button { min-height:44px; min-width:44px; flex:none; }
      #map-controls button,#map-bearing { background:#fffdf8; border:1px solid #c9bfae; border-radius:8px; padding:10px; font:14px system-ui; }
      #map-title { position:fixed; top:68px; left:12px; background:#fffdf8e8; border-radius:8px; padding:8px 12px; font-size:14px; }
      #picked { top:96px; }
      #map .evidence-mode [data-photo-file]:not(.selected-photo) path { display:none; }
    </style>
  </head>
  <body data-app-view="map">
    <nav id="app-nav" aria-label="Map views"><a class="app-brand" href="./">Villacana</a><button id="view-map" type="button" aria-pressed="true" aria-label="Map &amp; photos"><span class="nav-long">Map &amp; photos</span><span class="nav-short" aria-hidden="true">Map</span></button><button id="view-overview" type="button" aria-pressed="false">Overview</button><button id="view-walk" type="button" aria-pressed="false">Walk</button><button id="visit-silvia" type="button" aria-label="Silvia tunnel"><span class="nav-long">Silvia tunnel</span><span class="nav-short" aria-hidden="true">Silvia</span></button><button id="app-photo-toggle" type="button" aria-label="Find a photo"><span class="nav-long">Find a photo</span><span class="nav-short" aria-hidden="true">Photos</span></button><span id="app-selected"></span></nav>
    <section id="scene-page" hidden aria-label="Resort 3D view"><iframe id="resort-scene" title="Villacana resort overview and walk" allow="clipboard-write"></iframe></section>
    <div id="map-page">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="map-controls" role="toolbar" aria-label="Map camera controls">
      <button id="map-zoom-in" aria-label="Zoom in">+</button><button id="map-zoom-out" aria-label="Zoom out">−</button>
      <button id="reset">Fit whole resort</button>
      <button id="map-left" aria-label="Rotate left">↶</button><button id="map-right" aria-label="Rotate right">↷</button>
      <button id="layout-mode" aria-pressed="true">Layout</button><button id="map-frontages">Patios &amp; lawns</button><button id="map-north">North ↑</button><span id="map-bearing" aria-label="Map rotation"></span>
    </div>

    <div id="legend" hidden></div>
    <div class="bar" id="editbar" hidden>
      <select id="kind" aria-label="Kind of object to add"></select>
      <button id="delete" disabled>Delete</button>
      <button id="undo" disabled>Discard all</button>
    </div>
    <div id="picked"></div>
    <div class="bar" id="bar">
      <button id="send" hidden>Send changes</button>
      <details id="map-options"><summary>Layers &amp; editing</summary><div class="map-options-body">
      <a href="https://www.google.com/maps/@?api=1&amp;map_action=map&amp;center=36.4544655,-5.0511079&amp;zoom=18&amp;basemap=satellite" target="_blank" rel="noopener noreferrer">Google satellite</a><a href="https://www.google.com/maps/@?api=1&amp;map_action=map&amp;center=36.4544655,-5.0511079&amp;zoom=18&amp;basemap=roadmap" target="_blank" rel="noopener noreferrer">Google street map</a>

      <button id="edit" aria-pressed="false">Edit</button>
      <button id="photo" aria-pressed="false">Aerial photo</button>
      <button id="streets" aria-pressed="true">Streets</button>
      <button id="objects" aria-pressed="true">Objects</button>
      <button id="boundary" aria-pressed="true">Parking & fence</button>
      <button id="photos" aria-pressed="true">Photos</button>
      <button id="photo-evidence" aria-pressed="false" title="Select a photo to inspect its GPS uncertainty and suggested street links">Photo evidence</button>
      <button id="seafront" aria-pressed="true">Seafront</button>
      <button id="path-network-toggle" aria-pressed="false">Path network</button>
      <button id="heights" aria-pressed="false">Heights</button>
      <button id="key" aria-pressed="false">Key</button>






      </div></details>
    </div>
    </div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
