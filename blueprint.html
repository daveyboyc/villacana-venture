<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Villacana master map</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; height: 100%; background: #f3efe6; font-family: system-ui, sans-serif; overflow: hidden; }
      #map { width: 100vw; height: 100dvh; touch-action: none; display: block; }
      #bar { position: fixed; left: 12px; right: 12px; bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      #bar button, #bar a, #legend { background: #fffdf8; border: 1px solid #c9bfae; border-radius: 999px; padding: 8px 14px; font-size: 14px; color: #222; text-decoration: none; }
      #bar button[aria-pressed="true"] { background: #222; color: #fff; }
      #legend { position: fixed; top: 12px; left: 12px; border-radius: 12px; line-height: 1.6; }
      #legend { font-size: 13px; max-width: 46vw; }
      #viewer { position: fixed; inset: 0; background: #000d; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; z-index: 5; }
      #viewer[hidden] { display: none; }
      #viewer img { max-width: 96vw; max-height: 84dvh; border-radius: 8px; }
      #viewer p { color: #fff; margin: 0; font-size: 14px; text-align: center; padding: 0 12px; }
      #legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border: 1px solid #0006; vertical-align: -1px; }
    </style>
  </head>
  <body>
    <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="legend"></div>
    <div id="viewer" hidden><img alt="" /><p></p></div>
    <div id="bar">
      <button id="photo" aria-pressed="false">Aerial photo</button>
      <button id="cover" aria-pressed="true">Ground</button>
      <button id="streets" aria-pressed="true">Streets</button>
      <button id="objects" aria-pressed="true">Objects</button>
      <button id="photos" aria-pressed="true">Photos</button>
      <button id="reset">Whole block</button>
      <a href="./slice.html">Walk the north pool</a>
    </div>
    <script type="module" src="/src/blueprint.ts"></script>
  </body>
</html>
